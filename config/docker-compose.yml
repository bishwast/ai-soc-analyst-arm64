version: '3.8'

services:
  # --- COMPONENT 1: The SIEM (Wazuh Single-Node) ---
  wazuh.manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: wazuh-manager
    hostname: wazuh-manager
    restart: always
    ports:
      - "1514:1514"   # Agent connection
      - "1515:1515"   # Agent enrollment
      - "55000:55000" # API (We need this for the AI Agent)
      - "443:55000"   # Dashboard UI (mapped to 443 for easy access)
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
    volumes:
      - wazuh_data:/var/ossec/data

  # --- COMPONENT 2: The Brain (Ollama) ---
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434" # API Port
    volumes:
      - ollama_data:/root/.ollama
    # NVIDIA GPU Pass-through for DGX
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  wazuh_data:
  ollama_data: